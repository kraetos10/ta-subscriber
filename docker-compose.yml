services:
  ta-subscriber:
    build: .
    image: ta-subscriber:latest
    container_name: ta-subscriber
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      # Optional bootstrap values — used only on first run when the DB is empty.
      # After that, manage everything via the web UI.
      TA_URL: ${TA_URL:-}
      TA_TOKEN: ${TA_TOKEN:-}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-60}
      AUTOSTART: ${AUTOSTART:-false}
      MAX_AGE_DAYS: ${MAX_AGE_DAYS:-7}
      SOURCE: ${SOURCE:-db}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
